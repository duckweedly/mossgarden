<template id="writing-template">
  <section id="writing" class="feed-list" aria-label="最近文章">
      <!-- BEGIN_POSTS -->
      <a class="feed-item" href="posts/tiangong-ai-project-delivery-chain/">
        <div class="fmeta"><span class="ftag">企业AI</span><span>06 / 02</span></div>
        <h3 class="ftitle">我们做 AI，不该先从聊天框开始，而该先从项目交付链开始</h3>
        <p class="fexcerpt">对设备工程交付公司来说，AI 的第一步不是多一个聊天入口，而是让合同到回款的项目事实链先被系统化看见。</p>
      </a>
      <a class="feed-item" href="posts/tiangong-supply-chain-dark-river/">
        <div class="fmeta"><span class="ftag">供应链</span><span>06 / 01</span></div>
        <h3 class="ftitle">不能只盯现场，BOM、采购、齐套、生产、发货才是更早暴露风险的地方</h3>
        <p class="fexcerpt">现场问题往往不是现场才产生的。对设备工程交付来说，更高杠杆的管理对象，是 BOM、采购、齐套、生产、发货这条前置链路。</p>
      </a>
      <a class="feed-item" href="posts/tiangong-fde-delivery-system/">
        <div class="fmeta"><span class="ftag">FDE</span><span>05 / 31</span></div>
        <h3 class="ftitle">我们需要的 FDE，不是驻场救火的人，而是把合同变成交付系统的能力</h3>
        <p class="fexcerpt">在设备工程交付公司里，FDE 不该被理解成一个万能救火角色，而应是一种把客户场景、设备配置、供应链、现场和商务串起来的组织能力。</p>
      </a>
      <a class="feed-item" href="posts/tiangong-traceable-project-facts/">
        <div class="fmeta"><span class="ftag">可信链路</span><span>05 / 30</span></div>
        <h3 class="ftitle">可信 AI 的底座不是模型，而是配置、BOM、到货、安装、KPI、回款都能追溯</h3>
        <p class="fexcerpt">对设备工程交付公司来说，可信 AI 不能只停在答案引用，而要落到项目事实链：配置、BOM、到货、安装、KPI、验收、回款都能追溯。</p>
      </a>
      <!-- END_POSTS -->
  </section>
</template>

<template id="projects-template">
  <section id="projects" class="project-list" aria-label="项目">
      <!-- BEGIN_PROJECTS -->
      <article class="project-card">
        <div class="project-head"><span class="project-kind">站点 · 数字花园</span><h3 class="project-name">Random Thoughts</h3></div>
        <p class="project-desc">这座站点本身：从 Markdown 笔记生成静态页面、RSS、sitemap 和自定义域名部署。</p>
        <p>保留手写静态站的轻量感，同时补上主题记忆、语言切换、RSS 全文和基础 SEO。</p>
        <p>后续会继续把文章状态、归档和真实项目资产补齐。</p>
        <div class="stack"><span>Static HTML</span><span>Markdown</span><span>Node.js</span><span>GitHub Pages</span></div>
      </article>

      <article class="project-card">
        <div class="project-head"><span class="project-kind">写作 · 随想</span><h3 class="project-name">Notes in Progress</h3></div>
        <p class="project-desc">一些还没完全想清楚的问题，先种下来，再慢慢修剪。</p>
        <p>目前主要记录设计、工程、排版、动画和个人知识系统。</p>
        <p>比起完整教程，更像是一组持续生长的观察。</p>
        <div class="stack"><span>Design</span><span>Engineering</span><span>Writing</span></div>
      </article>

      <article class="project-card">
        <div class="project-head"><span class="project-kind">进行中 · 工具</span><h3 class="project-name">Small Tools</h3></div>
        <p class="project-desc">给自己用的小工具和实验，成熟后再公开整理。</p>
        <p>这里先保留入口，不放虚假的在线体验或仓库链接。</p>
        <p>等项目真的稳定，再补真实链接和图标。</p>
        <div class="stack"><span>Prototype</span><span>Local-first</span><span>WIP</span></div>
      </article>
      <!-- END_PROJECTS -->
  </section>
</template>
