<!DOCTYPE html>
<html lang="zh" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — 随想</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">
<link rel="alternate" type="application/rss+xml" title="随想" href="../../feed.xml">
<meta property="og:title" content="{{title}} — 随想">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:site_name" content="随想">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#070b09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f0e4" media="(prefers-color-scheme: light)">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{title}}",
  "description": "{{description}}",
  "url": "{{canonical_url}}",
  "datePublished": "{{iso_date}}",
  "dateModified": "{{iso_date}}",
  "inLanguage": "zh-CN",
  "isPartOf": {
    "@type": "WebSite",
    "name": "随想 · Random Thoughts",
    "url": "https://xuean.wiki/"
  }
}
</script>
<script>
  (() => {
    const theme = localStorage.getItem('theme');
    if (theme === 'day' || theme === 'night') document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="article-page">
<a class="skip-link" href="#content">跳到正文</a>
<div class="bg"></div>
<div class="orb"></div>
<div class="fireflies" id="fireflies" data-count="8"></div>

<div class="layout">
  <header class="topbar">
    <a href="../../" class="brand" title="回到随想">
      <span class="sprout" data-sprout></span>
      <span class="brand-text"><span class="brand-name">随想</span><span class="brand-sub">Random Thoughts</span></span>
    </a>
    <div class="top-actions">
      <nav class="nav-links" aria-label="站点导航">
        <a href="../../#writing" data-i18n="navWriting">文字</a>
        <a href="../../#projects" data-i18n="navProjects">造物</a>
      </nav>
      <button class="pill lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">EN</button>
      <button class="pill theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false"><span class="knob"></span></button>
    </div>
  </header>

  <main class="article-shell" id="content">
    <article>
      <header class="article-header">
        <a class="back" href="../../">← 随想</a>
        <div class="article-meta">
          <div class="article-tag">{{tag}}</div>
          <div class="article-date">{{date}}</div>
        </div>
        <div class="article-title-wrap">
          <h1>{{title}}</h1>
          <p class="article-description">{{description}}</p>
        </div>
      </header>

      <div class="article-body">
{{content}}
      </div>
    </article>

    <div class="article-end" aria-hidden="true">
      <span class="rule"></span>
      <span class="sprout" data-sprout></span>
      <span class="rule"></span>
    </div>

    <nav class="post-nav" aria-label="文章导航">
      <!-- IF_PREV -->
      <a href="{{prev_url}}" class="prev-nav">
        <div class="nav-label">上一篇</div>
        <div>{{prev_title}}</div>
      </a>
      <!-- /IF_PREV -->
      <!-- IF_NEXT -->
      <a href="{{next_url}}" class="next-nav">
        <div class="nav-label">下一篇</div>
        <div>{{next_title}}</div>
      </a>
      <!-- /IF_NEXT -->
    </nav>
  </main>
</div>

<footer class="site-footer">
  <p class="cp">© 2026 随想 Random Thoughts</p>
  <div class="socials">
    <a href="https://github.com/duckweedly" aria-label="GitHub">GitHub</a>
    <a href="../../feed.xml" aria-label="RSS">RSS</a>
  </div>
</footer>

</body>
</html>
