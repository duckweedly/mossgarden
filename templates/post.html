<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — 随想</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">
<link rel="alternate" type="application/rss+xml" title="随想" href="../../feed.xml">
<meta property="og:title" content="{{title}} — 随想">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:site_name" content="随想">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{title}}",
  "description": "{{description}}",
  "url": "{{canonical_url}}",
  "datePublished": "{{iso_date}}",
  "dateModified": "{{iso_date}}",
  "inLanguage": "zh-CN",
  "isPartOf": {
    "@type": "WebSite",
    "name": "随想 · Random Thoughts",
    "url": "https://xuean.wiki/"
  }
}
</script>
<script>
  (() => {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark' || theme === 'night') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Bungee+Shade&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="article-page Chinese">
<header class="site-header">
  <div class="header-title"><a href="../../">Random Thoughts</a></div>
  <div class="header-items">
    <div class="header-item-left">
      <button class="theme-toggle theme-icon" id="theme-toggle" type="button" aria-label="切换主题"></button>
    </div>
    <nav class="header-nav" aria-label="站点导航">
      <div class="nav-group nav-primary">
        <a class="header-item" href="../../series/">Series</a>
        <a class="header-item" href="../../projects/">Project</a>
        <a class="header-item" href="../../about/">About</a>
      </div>
    </nav>
  </div>
</header>

<main class="article-shell" id="content">
  <article>
    <header class="article-header post-header">
      <a class="back" href="../../">← Back</a>
      <div class="article-meta">
        <span class="article-tag post-tags">tegene</span>
        <span class="article-date post-date">{{date}}</span>
      </div>
      <div class="article-title-wrap">
        <h1 class="post-title">{{title}}</h1>
        <p class="article-description">{{description}}</p>
      </div>
    </header>

    <div class="article-body markdown-body post-content">
{{content}}
    </div>
  </article>

  <nav class="post-nav" aria-label="文章导航">
    <!-- IF_PREV -->
    <a href="{{prev_url}}" class="prev-nav">
      <div class="nav-label">上一篇</div>
      <div>{{prev_title}}</div>
    </a>
    <!-- /IF_PREV -->
    <!-- IF_NEXT -->
    <a href="{{next_url}}" class="next-nav">
      <div class="nav-label">下一篇</div>
      <div>{{next_title}}</div>
    </a>
    <!-- /IF_NEXT -->
  </nav>
</main>

<footer class="site-footer">
  <p class="cp">© 2026 随想 Random Thoughts</p>
  <div class="socials">
    <a href="https://github.com/duckweedly" aria-label="GitHub">GitHub</a>
    <a href="../../feed.xml" aria-label="RSS">RSS</a>
  </div>
</footer>

</body>
</html>
